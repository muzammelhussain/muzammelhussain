<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">

  <!-- ===== DEFINITIONS ===== -->
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Neon Name Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Neon Glow -->
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong Glow -->
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- ===== NAME ===== -->
  <text x="80" y="135"
        font-size="52"
        font-weight="800"
        font-family="Segoe UI, sans-serif"
        fill="url(#nameGrad)"
        filter="url(#strongGlow)">
    MUZAMMEL HUSSAIN
  </text>

  <!-- ===== ROLE ===== -->
  <text x="80" y="180"
        font-size="24"
        font-family="Segoe UI, sans-serif"
        fill="#22d3ee"
        filter="url(#neonGlow)"
        opacity="0">
    FULL STACK DEVELOPER • LAMP & MERN
    <animate attributeName="opacity"
             from="0" to="1"
             dur="1.4s"
             begin="0.5s"
             fill="freeze"/>
    <animateTransform
             attributeName="transform"
             type="translate"
             from="0 14" to="0 0"
             dur="1.4s"
             begin="0.5s"
             fill="freeze"/>
  </text>

  <!-- ===== NEON TECH CARDS ===== -->
  <g font-family="Segoe UI, sans-serif" font-weight="700" font-size="14">

    <!-- PHP -->
    <g transform="translate(720,100)" filter="url(#neonGlow)">
      <rect width="70" height="38" rx="10"
        fill="none" stroke="#a855f7" stroke-width="2"/>
      <text x="35" y="25" text-anchor="middle" fill="#a855f7">PHP</text>
      <animateTransform type="translate"
        values="720 100;720 92;720 100"
        dur="3s" repeatCount="indefinite"/>
    </g>

    <!-- Laravel -->
    <g transform="translate(800,145)" filter="url(#neonGlow)">
      <rect width="90" height="38" rx="10"
        fill="none" stroke="#f43f5e" stroke-width="2"/>
      <text x="45" y="25" text-anchor="middle" fill="#f43f5e">LARAVEL</text>
      <animateTransform type="translate"
        values="800 145;800 137;800 145"
        dur="3.4s" repeatCount="indefinite"/>
    </g>

    <!-- MySQL -->
    <g transform="translate(900,100)" filter="url(#neonGlow)">
      <rect width="80" height="38" rx="10"
        fill="none" stroke="#38bdf8" stroke-width="2"/>
      <text x="40" y="25" text-anchor="middle" fill="#38bdf8">MYSQL</text>
      <animateTransform type="translate"
        values="900 100;900 92;900 100"
        dur="2.8s" repeatCount="indefinite"/>
    </g>

    <!-- React -->
    <g transform="translate(990,145)" filter="url(#neonGlow)">
      <rect width="80" height="38" rx="10"
        fill="none" stroke="#22d3ee" stroke-width="2"/>
      <text x="40" y="25" text-anchor="middle" fill="#22d3ee">REACT</text>
      <animateTransform type="translate"
        values="990 145;990 137;990 145"
        dur="3.6s" repeatCount="indefinite"/>
    </g>

    <!-- Node -->
    <g transform="translate(1080,100)" filter="url(#neonGlow)">
      <rect width="80" height="38" rx="10"
        fill="none" stroke="#4ade80" stroke-width="2"/>
      <text x="40" y="25" text-anchor="middle" fill="#4ade80">NODE</text>
      <animateTransform type="translate"
        values="1080 100;1080 92;1080 100"
        dur="3.1s" repeatCount="indefinite"/>
    </g>

  </g>

</svg>
